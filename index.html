        // Attendance Actions with GPS Geofencing Validation
        const OFFICE_LOCATIONS = [
            { name: "Kantor Pusat 1", lat: -7.5366300, lng: 110.8405109 },
            { name: "Kantor Cabang 2", lat: -7.5576044, lng: 110.8189309 },

        ];

        function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth radius in meters
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; // Distance in meters
        }

        function verifyGeofenceAndExecute(actionType) {
            if (!navigator.geolocation) {
                showToast('Browser Anda tidak mendukung geolokasi GPS.', 'error');
                return;
            }

            showToast('Mengambil lokasi GPS perangkat Anda...');

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;

                    let isWithinAnyOffice = false;
                    let closestDistance = Infinity;

                    for (const office of OFFICE_LOCATIONS) {
                        const distance = calculateHaversineDistance(userLat, userLng, office.lat, office.lng);
                        if (distance < closestDistance) {
                            closestDistance = distance;
                        }
                        if (distance <= 100) {
                            isWithinAnyOffice = true;
                            break;
                        }
                    }

                    if (isWithinAnyOffice) {

                        else executeCheckOut();
                    } else {

        }

        }
